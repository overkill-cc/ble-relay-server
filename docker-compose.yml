services:
  relayd:
    build: .
    image: ble-relay-server:latest
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      # Point these at a real certificate for a public deployment, e.g.
      # certbot's /etc/letsencrypt/live/<domain>/. Mounted read-only.
      - ./certs:/etc/relayd/tls:ro
    command:
      - -addr
      - :8443
      - -tls-cert
      - /etc/relayd/tls/fullchain.pem
      - -tls-key
      - /etc/relayd/tls/privkey.pem

    # Local development only — skips the certs volume/command above.
    # Uncomment to run plain HTTP/WS instead:
    # command: ["-addr", ":8443", "-insecure-http"]
