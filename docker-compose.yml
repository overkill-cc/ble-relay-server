services:
  relayd:
    image: ghcr.io/overkill-cc/ble-relay-server:latest
    restart: unless-stopped
    # Bound to localhost only: the host's own cloudflared reaches relayd
    # here, but it's never exposed directly to the public internet — all
    # public traffic goes through the tunnel, which terminates TLS.
    ports:
      - "127.0.0.1:8443:8443"
    command: ["-addr", ":8443", "-insecure-http"]
