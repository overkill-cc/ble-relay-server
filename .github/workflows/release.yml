name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Releases are permanent, so never cancel a run that may already be publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Every build becomes a normal, permanent release. Hand-pushed v* tags
      # keep their own name; pushes to main get a dated build version, which
      # sorts chronologically and never collides with a hand-cut semver tag.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="v$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${platform%/*}
            goarch=${platform#*/}
            binary=relayd
            [ "$goos" = windows ] && binary=relayd.exe

            echo "==> $goos/$goarch"
            rm -rf build && mkdir build
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch GOARM=7 \
              go build -trimpath -ldflags='-s -w' -o "build/$binary" ./cmd/relayd

            archive="relayd_${VERSION}_${goos}_${goarch}"
            if [ "$goos" = windows ]; then
              (cd build && zip -q "../dist/${archive}.zip" "$binary")
            else
              tar -czf "dist/${archive}.tar.gz" -C build "$binary"
            fi
          done
          # Match the archives explicitly so SHA256SUMS can never list itself.
          (cd dist && sha256sum relayd_* > SHA256SUMS)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # --target creates the tag on this commit when the build came from a
          # branch push; for a tag push the tag already exists and is reused.
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
